[manifest]
version = "0.0.1"
dump_lua = true
priority = 214748365

# the trench reset
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''
-- TARGET: effects after end of round evaluation
'''
match_indent = true
position = 'after'
payload = '''
if BLINDSIDE then
    for i, card in pairs(G.playing_cards) do
        if card.ability and card.ability.extra and type(card.ability.extra) == 'table' then
            if card.ability.extra.e_chips and card.config.center.key == 'm_unik_blindside_epic_trench' then
                card.ability.extra.e_chips = card.ability.extra.e_chips_base
                card.ability.extra.x_chips = card.ability.extra.x_chips_base
            end
        end
        card.ability.unik_burned_by_hook = nil
        card.unik_burned_by_hook = nil
        
    end
end
'''

###hook fix
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''table.insert(cards, _cards[i])'''
match_indent = true
position = 'after'
payload = '''
if _cards[i].unik_burned_by_hook then
    _cards[i].unik_burned_by_hook = nil
    burned = true
end
'''

### hook fix2
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''table.insert(cards, _retained_cards[i])'''
match_indent = true
position = 'after'
payload = '''
if _retained_cards[i].unik_burned_by_hook then
    _retained_cards[i].unik_burned_by_hook = nil
    burned = true
end
'''

[[patches]]
[patches.pattern]
target = '=[SMODS Blindside "lib/utils/uishop.lua"]'
pattern = '''card:set_edition(edition, true)'''
match_indent = true
position = 'before'
payload = '''
edition = UNIK.add_detrimental_edition_blindside(edition)
'''

[[patches]]
[patches.pattern]
target = '=[SMODS Blindside "lib/utils/uishop.lua"]'
pattern = '''card:set_edition(edition, true)'''
match_indent = true
position = 'after'
payload = '''
if isDetrimentalEdition2(edition) then
card.cost = card.cost - 2
end
'''



[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''if v.small or v.big then bosses_used[k] = 0 end'''
match_indent = true
position = 'after'
payload = '''
if v.cursed then bosses_used[k] = 0 end
'''