[manifest]
version = "0.0.1"
dump_lua = true
priority = 214748365

### Bigger Blind and Boring Blank functionality to emulate Small and Big Blinds in appearance and functionality, while still ""bosses""
### And also make them ineligable for reroll (but can appear naturally) and not enable chicot/luchador to function

### Bigger blind colors
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''elseif blindname == 'Small Blind' or blindname == 'Big Blind' or blindname == '' then'''
position = "before"
payload = '''
elseif blindname == 'bl_unik_bigger_blind' or blindname == 'bl_unik_boring_blank' then
    ease_background_colour{new_colour = G.C.BLIND['Small'], contrast = 1}
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''elseif G.GAME.won then 
        ease_background_colour{new_colour = G.C.BLIND.won, contrast = 1}'''
position = "after"
payload = '''
elseif blindname == 'bl_unik_bigger_blind' or blindname == 'bl_unik_boring_blank' then
    ease_background_colour{new_colour = G.C.BLIND['Small'], contrast = 1}
'''
match_indent = true

##Ease ante when defeating bigger/boss blinds
[[patches]]
[patches.regex]
target = 'functions/state_events.lua'
pattern = '''G\.GAME\.blind\:get\_type\(\) \=\= \'Boss\''''
position = "at"
line_prepend = '$indent'
payload = '''(G.GAME.blind_on_deck == 'Boss') '''

# Rush Hour - mark small blind as defeated
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '''G\.GAME\.round\_resets\.blind \=\= G\.P\_BLINDS\.bl\_small'''
position = "at"
payload = "G.GAME.blind_on_deck == 'Small'"

# Rush Hour - mark small blind as defeated
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '''G\.GAME\.round\_resets\.blind \=\= G\.P\_BLINDS\.bl\_big'''
position = "at"
payload = "G.GAME.blind_on_deck == 'Big'"

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''G.GAME.bosses_used[boss] = G.GAME.bosses_used[boss] + 1'''
position = "before"
payload = '''
if boss then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''G.GAME.bosses_used[boss] = G.GAME.bosses_used[boss] + 1'''
position = "after"
payload = '''
else --fallback
    boss = 'bl_hook'
end
'''
match_indent = true

[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '''G\.GAME\.round\_resets\.ante \=\= G\.GAME\.win\_ante'''
position = "at"
payload = '''G.GAME.round_resets.ante >= G.GAME.win_ante'''

# add bigger blinds/boring blank into the blindpool initially if boss
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils/weights.lua"]'
pattern = '''for k, v in pairs(G.GAME.banned_keys) do'''
position = "before"
match_indent = true
payload = '''
if blind_type == 'boss' then
    
    if SMODS.is_showdown_ante() then
        local k = 'bl_unik_boring_blank'
        local res, options = SMODS.add_to_pool(G.P_BLINDS[k])
        options = options or {}
        if boss_already_chosen(k) then end
        eligible_bosses[k] = res and true or nil
    else
        local k = 'bl_unik_bigger_blind'
        local res, options = SMODS.add_to_pool(G.P_BLINDS[k])
        options = options or {}
        if boss_already_chosen(k) then end
        eligible_bosses[k] = res and true or nil
    end
else
    eligible_bosses['bl_unik_boring_blank'] = nil
    eligible_bosses['bl_unik_bigger_blind'] = nil
end

'''