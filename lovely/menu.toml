[manifest]
version = "0.0.1"
dump_lua = true
priority = 214748365

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "replace_card.states.visible = false"
position = "before"
payload = '''
if unik_config.unik_custom_menu then
    replace_card:set_edition(G.P_CENTERS.e_unik_fuzzy and 'e_unik_fuzzy' or 'e_negative',true,true)
end
'''
match_indent = true

[[patches]]
[patches.regex]
target = "game.lua"
pattern = '''G\.P\_CARDS\.S\_A'''
position = "at"
payload = '''unik_config.unik_custom_menu and G.P_CARDS.unik_CROSSES_A or G.P_CARDS.S_A'''
match_indent = true