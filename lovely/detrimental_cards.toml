[manifest]
version = "1.0.0"
dump_lua = true
priority = 214748365

# Adds detrimental pin area to calculation pipeline
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
match_indent = true
position = 'after'
pattern = '''
-- TARGET: add your own CardAreas for joker evaluation
'''
payload = '''
table.insert(t, 2, G.unik_detriment_area)
'''

[[patches]]
[patches.regex]
target = 'card.lua'
match_indent = true
position = 'after'
pattern = '''if self\.ability\.consumeable or self\.ability\.set \=\= \'Joker\''''
payload = ''' or self.config.center.set == 'Detriment' '''

# invisiible
[[patches]]
[patches.pattern]
target = 'cardarea.lua'
match_indent = true
position = 'after'
pattern = '''(self.config.type == 'shop' and self ~= G.shop_vouchers) then'''
payload = '''
elseif G.unik_detriment_area and self == G.unik_detriment_area then
'''

# addtoarea
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
match_indent = true
position = 'before'
pattern = '''elseif card.ability.set == 'Joker' then '''
payload = '''
elseif card.ability.set == 'Detriment' then 
    card:add_to_deck()
    G.unik_detriment_area:emplace(card)
    play_sound('card1', 0.8, 0.6)
    play_sound('generic1')
    dont_dissolve = true
    delay_fac = 0.2
'''
