[manifest]
version = "0.0.1"
dump_lua = true
priority = 99999

[[patches]]
[patches.pattern]
target = '=[SMODS Blindside "lib/gameobject.lua"]'
pattern = '''if self.legendary then
        self.weight = 99 -- secret code for "i am legendary"'''
match_indent = true
position = 'before'
payload = '''
if self.unik_ancient then
    self.weight = 700
end
if self.unik_exotic then
    self.weight = 999
end
'''

[[patches]]
[patches.pattern]
target = '=[SMODS Blindside "lib/gameobject.lua"]'
pattern = '''elseif card.config.center.weight == 99 then'''
match_indent = true
position = 'before'
payload = '''

elseif card.config.center.weight == 700 then
    badges[#badges+1] = create_badge(localize('k_unik_ancient'), G.C.UNIK_ANCIENT, G.C.WHITE, 1 )
elseif card.config.center.weight == 999 then
    badges[#badges+1] = create_badge(localize('k_unik_exotic'), G.C.UNIK_EXOTIC, G.C.WHITE, 1 )
'''

[[patches]]
[patches.pattern]
target = '=[SMODS Blindside "lib/gameobject.lua"]'
pattern = '''if self.legendary then
        self.pools["bld_obj_blindcard_legendary"] = true'''
match_indent = true
position = 'before'
payload = '''
if self.unik_ancient then
    self.pools["unik_obj_blindcard_ancient"] = true
end
if self.unik_exotic then
    self.pools["unik_obj_blindcard_exotic"] = true
end
'''

[[patches]]
[patches.pattern]
target = '=[SMODS Blindside "lib/utils/utils.lua"]'
pattern = '''elseif args.legendary then'''
match_indent = true
position = 'before'
payload = '''elseif args.unik_ancient then
    rarity = 70
elseif args.unik_exotic then
    rarity = 99
'''

[[patches]]
[patches.regex] 
target = '=[SMODS Blindside "lib/utils/utils.lua"]'
pattern = '''\(wght == 99 and rarity == 4\)'''
match_indent = true
position = 'after'
payload = ''' or (wght == 700 and rarity == 70) or (wght == 999 and rarity == 99)'''

[[patches]]
[patches.regex]
target = '=[SMODS Blindside "lib/utils/utils.lua"]'
pattern = '''or rarity == 4'''
match_indent = true
position = 'after'
payload = ''' or rarity == 70 or rarity == 99'''




##LEGENDARY BLIND SQUARES
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/card_draw.lua"]'''
pattern = '''elseif self.seal then
            G.shared_seals[self.seal].role.draw_major = self
            G.shared_seals[self.seal]:draw_shader('dissolve', nil, nil, nil, self.children.center)
            if self.seal == 'Gold' then G.shared_seals[self.seal]:draw_shader('voucher', nil, self.ARGS.send_to_shader, nil, self.children.center) end
        end'''
position = "before"
payload = '''
-- EXOTIC/LEGENDARY BLINDS ARE SQUARE
elseif self.seal and G.P_SEALS[self.seal] and  G.P_SEALS[self.seal].pools and G.P_SEALS[self.seal].pools["bld_obj_enhancements"] and self.config.center.unik_exotic then
    --If it has an atlas sheet, print that instead
    if G.P_SEALS[self.seal].legendary_atlas and  G.P_SEALS[self.seal].legendary_atlas_coords then
        if not self.children["unik_legendary_trim_render_" .. G.P_SEALS[self.seal].key] then
            self.children["unik_legendary_trim_render_" .. G.P_SEALS[self.seal].key] = Sprite(self.T.x, self.T.y, self.T.w, self.T.h, G.ASSET_ATLAS[G.P_SEALS[self.seal].legendary_atlas], G.P_SEALS[self.seal].legendary_atlas_coords)
            self.children["unik_legendary_trim_render_" .. G.P_SEALS[self.seal].key].states.visible = false
        end
        self.children["unik_legendary_trim_render_" .. G.P_SEALS[self.seal].key].role.draw_major = self
        self.children["unik_legendary_trim_render_" .. G.P_SEALS[self.seal].key]:draw_shader('dissolve', nil, nil, nil, self.children.center)
        if self.seal == 'Gold' then G.shared_seals[self.seal]:draw_shader('voucher', nil, self.ARGS.send_to_shader, nil, self.children.center) end
    else
        G.shared_seals[self.seal].role.draw_major = self
        G.shared_seals[self.seal]:draw_shader('unik_blindside_square', nil, nil, nil, self.children.center)
        if self.seal == 'Gold' then G.shared_seals[self.seal]:draw_shader('voucher', nil, self.ARGS.send_to_shader, nil, self.children.center) end
    end

'''
match_indent = true

###upgrade stickers will be changed into rectangular ones
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/card_draw.lua"]'''
pattern = '''if v and v.draw and type(v.draw) == 'function' then
                    v:draw(self, layer)'''
position = "after"
payload = '''
--change sprite if exotic and bld_upgrade
elseif self.config.center.unik_exotic and self.ability[v.key] and v.key == 'bld_upgrade' then
    if not self.children["unik_legendary_upgrade_render"] then
        self.children["unik_legendary_upgrade_render"] = Sprite(self.T.x, self.T.y, self.T.w, self.T.h, G.ASSET_ATLAS['unik_legendary_blind_enhancements'], {x = 0, y = 2})
        self.children["unik_legendary_upgrade_render"].states.visible = false
    end
    self.children["unik_legendary_upgrade_render"].role.draw_major = self
    self.children["unik_legendary_upgrade_render"]:draw_shader('dissolve', nil, nil, nil, self.children.center)
    self.children["unik_legendary_upgrade_render"]:draw_shader('voucher', nil, self.ARGS.send_to_shader, nil, self.children.center)
    self.children["unik_legendary_upgrade_render"]:draw_shader('bld_shiny', nil, self.ARGS.send_to_shader, nil, self.children.center)
'''
match_indent = true

###if you flip legendary blinds, they should be square shaped, as weird as they would look
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/card_draw.lua"]'''
pattern = '''self.children.back:draw_shader('dissolve')'''
position = "before"
payload = '''
if self.config.center.unik_exotic then
    self.children.back:draw_shader('unik_blindside_square_back')
else
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/card_draw.lua"]'''
pattern = '''self.children.back:draw_shader('dissolve')'''
position = "after"
payload = '''
end
'''
match_indent = true